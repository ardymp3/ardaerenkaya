<!doctype html>
<html lang="tr" data-base="..">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Contact | Arda Eren Kaya</title>
    <meta name="description" content="Contact Arda Eren Kaya for music, sound engineering and music technology projects.">
    <link rel="stylesheet" href="../assets/styles.css">
  </head>
  <body>
    <header class="site-header">
      <a class="brand" href="../index.html">
        <span class="brand-mark">AEK</span>
        <span>Arda Eren Kaya</span>
      </a>
      <nav class="nav-links" aria-label="Primary navigation">
        <a href="../about/">About</a>
        <a href="../works/">Works</a>
        <a href="./">Contact</a>
      </nav>
    </header>

    <main>
      <section class="contact-form-section">
        <form class="contact-form" action="mailto:ardaerenkayaa@gmail.com" method="post" enctype="text/plain">
          <label>
            <span>Name *</span>
            <input name="name" type="text" placeholder="Your Name..." required>
          </label>
          <label>
            <span>Email Address *</span>
            <input name="email" type="email" placeholder="Your Email Address..." required>
          </label>
          <label>
            <span>Message *</span>
            <textarea name="message" placeholder="Your Message..." required></textarea>
          </label>
          <button type="submit">SUBMIT</button>
        </form>
      </section>

    </main>

    <footer class="site-footer">
      <span>© <span data-year></span> Arda Eren Kaya</span>
      <div class="social-row" data-socials></div>
    </footer>

    <script src="../assets/js/site-data.js"></script>
    <script src="../assets/js/main.js"></script>
  </body>
</html>
